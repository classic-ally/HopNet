# Standalone workspace: excluded from the parent HopNet workspace because
# sqlx 0.9's optional sqlx-mysql requires sha2 ^0.11.0, which conflicts with
# iroh-base's sha2 =0.11.0-rc.5 pin in the parent graph. Own Cargo.lock.
# Rejoin the parent workspace once iroh drops the prerelease pin.
[workspace]
resolver = "3"
members = [
    "ingress-cli",
    "ingress-core",
    "ingress-ffi",
    "ingress-publisher",
]
