[package]
name = "ingress-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Platform-agnostic core for the Apple Photos ingress daemon (state store, identity resolution, sidecars)"

[features]
# AssetDescriptor builders for this crate's tests and downstream consumers' tests
fixtures = []

[dependencies]
# sqlx 0.9 (not 0.8) is required: sqlx-sqlite 0.8 pins libsqlite3-sys 0.30.1, which
# conflicts with rusqlite 0.38's libsqlite3-sys 0.36 via links="sqlite3" in this workspace.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
    "derive",
    "chrono",
    "uuid",
] }
chrono = { version = "0.4.41", features = ["serde"] }
uuid = { version = "1.17.0", features = ["v7", "serde"] }
blake3 = "1.8.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"

[dev-dependencies]
tokio = { version = "1.45", features = ["macros", "rt"] }
ingress-core = { path = ".", features = ["fixtures"] }
tempfile = "3"
