# ingress-server configuration. Copy to config.toml and edit for the host.
# Paths are LOCAL to the machine running the server (the NAS), NOT the Mac's
# mount paths — the server reads blobs + sidecars off local storage.

bind = "0.0.0.0:8080"
cache_dir = "/tank/ingress-viewer/cache"
index_db = "/tank/ingress-viewer/index.db"
refresh_interval_secs = 60

# sidecar_root is the library's replicated sidecar tree — the YYYY/MM buckets
# sit directly under it (it is the daemon's per-library sidecar_root_remote),
# NOT nested under the library id.
# access.groups: a user may see this library iff their OIDC `groups` claim
# intersects this list. An unlisted library denies by default.
# shared: marks a multi-person library — the viewer badges its assets when
# showing a fused multi-library timeline.
[[libraries]]
library_id = "vivid_birch"
display_name = "Shared"
blob_root = "/tank/shared/photos"
sidecar_root = "/tank/shared/photos/sidecars"
shared = true
access = { groups = ["shared_photo_library"] }

# [[libraries]]
# library_id = "personal_xxx"
# display_name = "Personal"
# blob_root = "/tank/personal/photos"
# sidecar_root = "/tank/personal/photos/sidecars"
# access = { groups = ["allisons_photo_library"] }

# OIDC (pocket-id). The client secret is NEVER here — set the env var
# INGRESS_SERVER_OIDC_CLIENT_SECRET on the host.
[oidc]
issuer = "https://id.bentley.sh"
client_id = "ab5de5be-dfff-48e7-8208-fb1c14c3f509"
redirect_uri = "https://photo.bentley.sh/auth/callback"
post_logout_redirect_uri = "https://photo.bentley.sh/"
# dev_insecure_cookies = true   # only for http://localhost dev
