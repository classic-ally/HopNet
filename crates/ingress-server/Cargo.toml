[package]
name = "ingress-server"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Read-only web viewer for the Apple Photos ingress blob store (sidecar-tree index)"

[dependencies]
ingress-core = { path = "../ingress-core" }
axum = "0.8"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
# Pinned to EXACTLY ingress-core's sqlx 0.9.0 so the workspace lockfile keeps a
# single libsqlite3-sys; a different minor forks it and reintroduces the
# links="sqlite3" collision this workspace exists to avoid. No `macros` feature:
# runtime query/QueryBuilder only, so no DATABASE_URL is needed at build time.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4.41", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
typeshare = "1"
url = "2.5"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tower-sessions = "0.15"
# rustls forced (default-features=false drops native-tls); reqwest's rustls-tls
# resolves to the `ring` provider — cc-only, no openssl-sys / aws-lc-sys / bindgen,
# keeping this slice C-dep-free (same category as the bundled sqlite).
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "json"] }
# Renderer (slice 2b). These pull C libs (libheif via pkg-config, ffmpeg via
# bindgen) — build needs the devshell in shell.nix (libheif + ffmpeg_7 +
# bindgenHook). Pin ffmpeg-next to 7.x: ffmpeg 8 dropped avfft.h (see spike).
libheif-rs = "1.0"
image = "0.25"
ffmpeg-next = "7.1"

[dev-dependencies]
tempfile = "3"
