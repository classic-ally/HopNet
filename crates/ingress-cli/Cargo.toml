[package]
name = "ingress-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Operator CLI for the Apple Photos ingress daemon: status, fsck, recover, library config"

[dependencies]
ingress-core = { path = "../ingress-core" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.45", features = ["rt", "macros"] }
serde = "1.0.219"
serde_json = "1.0"
