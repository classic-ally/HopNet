[package]
name = "ingress-ffi"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "UniFFI bridge exposing ingress-core to the Swift PhotoKit shim"

[lib]
# staticlib for the Swift link; lib so the bindgen bin and Rust tests can use it
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
ingress-core = { path = "../ingress-core" }
ingress-publisher = { path = "../ingress-publisher" }
uniffi = { version = "0.31.2", features = ["cli", "tokio"] }
tokio = { version = "1.45", features = ["rt-multi-thread"] }
chrono = "0.4.41"
serde_json = "1.0"
thiserror = "2.0.18"

[dev-dependencies]
ingress-core = { path = "../ingress-core", features = ["fixtures"] }
tempfile = "3"
