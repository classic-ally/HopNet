[package]
name = "hopnet-takeout"
version.workspace = true
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://git.bentley.sh/HopNet/HopNet"
description = "HopNet projection-agnostic takeout/import service: manifest-v2 archives, per-projection translator dispatch, resume machinery, and the takeout/import consensus handlers (RFC-015)"

[dependencies]
hopnet-common = { path = "../common", features = ["database"] }
hopnet-projection = { path = "../hopnet-projection" }
hopnet-storage = { path = "../hopnet-storage" }

# Version strings mirror the root Cargo.toml pins (workspace-unified).
axum = { version = "0.8.4", features = ["multipart", "macros"] }
bincode = { version = "2.0.1", features = ["serde"] }
blake3 = { version = "1.8.2", features = ["serde", "rayon"] }
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
flate2 = "1.1.2"
inventory = "0.3.20"
once_cell = "1.21.3"
r2d2 = "0.8.10"
r2d2_sqlite = "0.32"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
tar = "0.4.44"
thiserror = "2.0.18"
tokio = { version = "1.45.1", features = ["full"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.16", features = ["io"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.22.0"
