[package]
name = "hopnet-common"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
typeshare = "1.0.4"
chrono = { version = "0.4.41", features = ["serde"] }

# Optional database dependencies - only for main binary
duckdb = { version = "1.3.2", features = ["bundled", "r2d2"], optional = true }

[features]
default = []
database = ["duckdb"]