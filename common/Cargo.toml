[package]
name = "hopnet-common"
version.workspace = true
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://git.bentley.sh/HopNet/HopNet"
description = "Shared types and traits for HopNet"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
typeshare = "1.0.4"
chrono = { version = "0.4.41", features = ["serde"] }
uuid = { version = "1.17.0", features = ["serde", "v4", "v7"] }
blake3 = "1.8.2"
hex = "0.4.3"
bincode = { version = "2.0.1", features = ["serde"] }

# Optional database dependencies - only for main binary
rusqlite = { version = "0.38", features = ["bundled", "functions"], optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = []
database = ["rusqlite"]