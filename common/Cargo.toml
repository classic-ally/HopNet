[package]
name = "hopnet-common"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
typeshare = "1.0.4"
chrono = { version = "0.4.41", features = ["serde"] }
uuid = { version = "1.17.0", features = ["serde", "v4", "v7"] }

# Optional database dependencies - only for main binary
rusqlite = { version = "0.38", features = ["bundled"], optional = true }

[features]
default = []
database = ["rusqlite"]