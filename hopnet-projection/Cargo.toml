[package]
name = "hopnet-projection"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://git.bentley.sh/HopNet/HopNet"
description = "HopNet projection seam: the transaction-handler contract, change notification, and GC/export registries every projection crate implements (RFC-015)"

[dependencies]
hopnet-common = { path = "../common", features = ["database"] }
# Default features only (no engine): BlobStreamer's vocabulary types
# (BlobManifest, StorageError) are un-gated. RFC-016 layering decision:
# projection → storage, so blob streaming can live in HostCapabilities;
# consequence: hopnet-storage must never depend on hopnet-projection.
hopnet-storage = { path = "../hopnet-storage" }

aes-siv = "0.7.0"
axum = "0.8.4"
bytes = "1.10.1"
chacha20poly1305 = { version = "0.10.1", features = ["stream"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.32"
chrono = { version = "0.4.41", features = ["serde"] }
# Bounded 1us..60s commit-latency histogram (dbstats); pins mirror the root.
hdrhistogram = { version = "7.5.4", default-features = false }
inventory = "0.3.20"
once_cell = "1.21.3"
parking_lot = "0.12.5"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45.1", features = ["sync"] }
tokio-stream = "0.1.17"
tracing = "0.1"
x25519-dalek = { version = "2.0.1", features = ["serde", "static_secrets"] }
