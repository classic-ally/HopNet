[package]
name = "hopnet-photos-core"
version.workspace = true
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://git.bentley.sh/HopNet/HopNet"
description = "HopNet photos core: crypto, metadata, payload builders, dispatch seam, and optional local sidecar for RFC-011"

[dependencies]
hopnet-common = { path = "../common" }
hopnet-storage = { path = "../hopnet-storage" }
hopnet-photos = { path = "../hopnet-photos", default-features = false }

blake3 = "1.8.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2.0.1", features = ["serde"] }
chacha20poly1305 = { version = "0.10.1", features = ["stream"] }
thiserror = "2.0.18"
async-trait = "0.1"
tokio = { version = "1", features = ["io-util"] }

rusqlite = { version = "0.38", features = ["bundled", "functions"], optional = true }

[dev-dependencies]
# publisher tests drive the real storage engine put path
hopnet-storage = { path = "../hopnet-storage", features = ["engine"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread"] }
tempfile = "3"

[features]
default = []
sidecar = ["dep:rusqlite"]
