# Cargo configuration for HopNet project

[alias]
# Make cargo check also validate tests, benchmarks, and examples
check = "check --all-targets"

# Run FileProvider integration tests with clean output and correct Swift SDK
test-fileprovider = "test --quiet fileprovider_integration --test fileprovider_integration -- --nocapture"

[env]
# Force use of system SDK instead of Nix SDK for Swift compilation
DEVELOPER_DIR = "/Applications/Xcode.app/Contents/Developer"
SDKROOT = "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"