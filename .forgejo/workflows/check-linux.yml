name: Check (Linux)

# Fast checks on every push + same-repo PR: cargo fmt/clippy/test,
# nix build of the headless hopnet binary. Runs on desktop self-hosted runner.
#
# Fork PRs are intentionally skipped at the job level — see the `if:` guard.
# Forgejo has no first-contributor approval gate yet, so we hard-restrict
# CI to code we already control. To run CI against a fork's branch, push it
# into this repo manually (e.g. `git push origin pr/123-review`).
on:
  push:
    branches: [master]
  pull_request:

jobs:
  cargo:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: x86_64-linux
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry + workspace target/
        # Full URL keeps the action source explicit and bypasses the default
        # data.forgejo.org lookup (which only mirrors actions/*).
        uses: https://github.com/Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: cargo fmt --check
        run: nix develop --command cargo fmt --all -- --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (unit only — skips orchestrator)
        run: nix develop --command cargo test --workspace --lib --bins

  nix-build:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: x86_64-linux
    # A workspace-wide change (toolchain bump, reformat) forces a full
    # release rebuild (~30m alone) while the cargo job competes for the
    # same runner's cores — 45m was calibrated for incremental pushes.
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: nix build .#default
        run: nix build .#default --print-build-logs

      - name: Verify headless binary
        run: test -x result/bin/hopnet

      - name: nix build .#hopnet-mount
        run: nix build .#hopnet-mount --print-build-logs

      - name: Verify mount binary
        run: test -x result/bin/hopnet-mount
