# Typeshare configuration for generating Swift and TypeScript types

[swift]
# Output directory for generated Swift files
swift_file = "apple/HopNetFileProvider/Sources/HopNetFileProviderExtension/Generated/HopNetTypes.swift"

# Swift-specific configurations
[swift.decorators]
# Use camelCase for Swift property names
rename_all = "camelCase"

[typescript]
# Output directory for generated TypeScript files
typescript_file = "frontend/src/lib/types.ts"

# TypeScript type substitutions
[typescript.type_mappings]
"DateTime<chrono::Utc>" = "string"
"chrono::DateTime<chrono::Utc>" = "string"

# Optional: Specify which Rust crates to process
[[targets]]
target = "swift"
# Process types from the common crate
input_path = "common/src/"

[[targets]]
target = "typescript"
input_path = "common/src/"