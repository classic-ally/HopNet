[package]
name = "network-metrics"
version = "0.1.0"
edition = "2024"

[features]
default = ["headless"]
gui = ["tauri", "tauri-build", "cocoa"]
headless = []

[dependencies]
axum = { version = "0.8.4", features = ["multipart", "macros"] }
chrono = { version = "0.4.41", features = ["serde"] }
rand = "0.9.1"
tokio = { version = "1.45.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
reqwest = { version = "0.12.19", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
tower-serve-static = "0.1.1"
include_dir = "0.7.4"
tower-http = { version = "0.6.6", features = ["cors"] }
duckdb = { version = "1.3.1", features = ["bundled", "r2d2"] }
r2d2 = "0.8.10"
network-interface = { version = "2.0.1", features = ["serde"] }
argon2 = {version = "0.5.3", features = ["std"]}
jsonwebtoken = "9.3.1"
ed25519-dalek = { version = "2.1.1", features = ["rand_core", "batch", "serde"] }
x25519-dalek = { version = "2.0.1", features = ["serde", "static_secrets"] }
rand_core = "0.6"
hex = "0.4.3"
blake3 = { version = "1.8.2", features = ["serde", "rayon"] }
bincode = {version = "2.0.1", features = ["serde"] }
inventory = "0.3.20"
once_cell = "1.21.3"
uuid = { version = "1.17.0", features = ["serde", "v4", "v7"] }
either = { version = "1.15.0", features = ["serde"] }
reed-solomon-simd = "3.0.1"
rayon = "1.10.0"
aes-siv = "0.7.0"
chacha20poly1305 = { version = "0.10.1", features = ["stream"] }
apalis = "0.7.2"
apalis-cron = "0.7.2"
bollard = "0.19.1"
anyhow = "1.0.98"
clap = { version = "4.5.41", features = ["derive"] }
fs4 = "0.13.1"

# Tauri dependencies (optional for GUI mode)
tauri = { version = "2.7.0", features = ["tray-icon"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = { version = "0.26", optional = true }

[build-dependencies]
tauri-build = { version = "2.3.1", optional = true }

[[bin]]
name = "hopnet"
path = "src/main.rs"

[[bin]]
name = "orchestrator"
path = "orchestrator/main.rs"
