[workspace]
members = [".", "common", "hopnet-comms", "hopnet-consensus", "hopnet-storage", "hopnet-projection", "hopnet-drive", "hopnet-mount", "hopnet-photos", "hopnet-photos-core", "hopnet-takeout"]
# crates/ingress-core is deliberately NOT a member: its sqlx 0.9 dependency
# (via optional sqlx-mysql) requires sha2 ^0.11.0, which cannot unify with
# iroh-base's sha2 =0.11.0-rc.5 pin. It is a standalone workspace with its
# own lockfile; rejoin once iroh drops the prerelease pin.
exclude = ["crates/ingress-core", "crates/ingress-ffi"]

[package]
name = "hopnet"
# CalVer YYYY.M.N (RFC-019 S3): year.month.counter-within-month. This is
# the SINGLE authoritative version token — release tags are v{version},
# the node attests it in consensus, and the epoch boot gate compares it
# by exact equality. See src/version.rs for the integer encoding.
version = "2026.8.3"
edition = "2024"
default-run = "hopnet"
license = "AGPL-3.0-only"
repository = "https://git.bentley.sh/HopNet/HopNet"
description = "Distributed filesystem with Byzantine fault-tolerant consensus and Reed-Solomon erasure coding"

# Suppress warnings for better test output readability during active development
# TODO: Consider tightening these lints once the codebase stabilizes
[lints.rust]
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"

[features]
default = ["headless"]
gui = ["tauri", "tauri-build", "cocoa"]
headless = []
skip-frontend = []  # Skip frontend build (for orchestrator-only builds)

[dependencies]
hopnet-common = { path = "common", features = ["database"] }
hopnet-comms = { path = "hopnet-comms", features = ["iroh"] }
hopnet-consensus = { path = "hopnet-consensus", features = ["shell"] }
hopnet-storage = { path = "hopnet-storage", features = ["engine"] }
hopnet-projection = { path = "hopnet-projection" }
hopnet-drive = { path = "hopnet-drive" }
hopnet-photos = { path = "hopnet-photos" }
hopnet-photos-core = { path = "hopnet-photos-core", features = ["sidecar"] }
async-trait = "0.1"
hopnet-takeout = { path = "hopnet-takeout" }
axum = { version = "0.8.4", features = ["multipart", "macros"] }
chrono = { version = "0.4.41", features = ["serde"] }
rand = "0.10"
tokio = { version = "1.45.1", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["io"] }
tokio-stream = "0.1.17"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
reqwest = { version = "0.12.19", features = ["json", "multipart", "rustls-tls-manual-roots"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
tower-serve-static = "0.1.1"
include_dir = "0.7.4"
tower = { version = "0.5.2", features = ["limit", "load-shed"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
rusqlite = { version = "0.38", features = ["bundled", "functions", "hooks"] }
r2d2_sqlite = "0.32"
r2d2 = "0.8.10"
argon2 = {version = "0.5.3", features = ["std"] }
jsonwebtoken = "9.3.1"
ed25519-dalek = { version = "3.0.0-pre.6", features = ["rand_core", "batch", "serde"] }
x25519-dalek = { version = "2.0.1", features = ["serde", "static_secrets"] }
# Pinned to match iroh-fork's known-good resolution; resolver otherwise picks
# digest 0.11.3 + crypto-common 0.2.0 which has an upstream trait-bound bug.
digest = "=0.11.2"
crypto-common = "=0.2.1"
# ed25519-dalek 3.0.0-pre.6 was built against keccak 0.2.0-rc.1; final 0.2.0
# release renamed/removed `f1600`. Drop this pin when iroh-fork bumps to
# ed25519-dalek 3.0.0-pre.7 (which uses strobe-rs and accepts keccak ^0.2).
keccak = "=0.2.0-rc.1"
hex = "0.4.3"
mime_guess = "2.0.5"
blake3 = { version = "1.8.2", features = ["serde", "rayon"] }
bincode = {version = "2.0.1", features = ["serde"] }
inventory = "0.3.20"
once_cell = "1.21.3"
uuid = { version = "1.17.0", features = ["serde", "v4", "v7"] }
either = { version = "1.15.0", features = ["serde"] }
reed-solomon-simd = "3.0.1"
rayon = "1.10.0"
aes-siv = "0.7.0"
chacha20poly1305 = { version = "0.10.1", features = ["stream"] }
async-stream = "0.3.6"
bytes = "1.10.1"
apalis = "0.7.2"
apalis-cron = "0.7.2"
bollard = "0.19.1"
tar = "0.4.44"
flate2 = "1.1.2"
tempfile = "3.22.0"
anyhow = "1.0.98"
clap = { version = "4.5.41", features = ["derive"] }
fs4 = "0.13.1"
urlencoding = "2.1.3"
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png"] }
base64 = "0.22"

# Pinned-HTTPS network surface (docs/specs/pinned-https.md). All pinned to the
# ring provider: iroh already vendors ring, and axum-server's default
# `tls-rustls` feature would drag in aws-lc-sys (C/CMake build) plus a
# two-provider ambiguity. Keep `-no-provider` + explicit ring everywhere.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
ring = "0.17"
rustls-pemfile = "2"
x509-parser = "0.17"

# Tauri dependencies (optional for GUI mode)
tauri = { version = "2.7.0", features = ["tray-icon", "image-png"], optional = true }
thiserror = "2.0.18"
parking_lot = "0.12.5"
hdrhistogram = { version = "7.5.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = { version = "0.26", optional = true }
# FileProvider dependencies for macOS (needed for domain registration)
objc2-file-provider = "0.3.1"
objc2-foundation = "0.3.1"
objc2 = "0.6.2"
block2 = "0.6.1"
# SMAppService for the bundled photo-ingress LaunchAgent
objc2-service-management = "0.3.2"
# Security framework for keychain access
security-framework = "3.3.0"

[build-dependencies]
tauri-build = { version = "2.3.1", optional = true }

[lib]
name = "hopnet"
path = "src/lib.rs"

[[bin]]
name = "hopnet"
path = "src/main.rs"

[[bin]]
name = "orchestrator"
path = "orchestrator/main.rs"

[[bin]]
name = "snapshotter"
path = "snapshotter/main.rs"

[[bin]]
name = "photo-seeder"
path = "seeder/main.rs"

[patch.crates-io]
iroh = { git = "https://github.com/classic-ally/iroh", branch = "auth-before-register-v0.98" }

# FileProvider now implemented in Swift
# [[bin]]
# name = "fileprovider"
# path = "apple/fileprovider/main.rs"
