[package]
name = "hopnet-mount"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://git.bentley.sh/HopNet/HopNet"
description = "Linux FUSE mount daemon projecting the HopNet drive (RFC-018)"

# Version strings mirror the root Cargo.toml pins (workspace-unified).
[dependencies]
async-stream = "0.3.6"
hopnet-common = { path = "../common" }
reqwest = { version = "0.12.19", features = ["json", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
# sync/time only — no runtime linked; the platform-neutral core (watch
# loop, mock streams) needs channels and timeouts, not an executor.
tokio = { version = "1.45.1", features = ["sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
clap = { version = "4.5.41", features = ["derive"] }
tracing-subscriber = "0.3.19"
rustix = { version = "1.0", features = ["process"] }

[dev-dependencies]
reqwest = { version = "0.12.19", features = ["json", "multipart"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros", "time"] }
