[package]
name = "hopnet-mount"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://git.bentley.sh/HopNet/HopNet"
description = "Linux FUSE mount daemon projecting the HopNet drive (RFC-018)"

# Version strings mirror the root Cargo.toml pins (workspace-unified).
[dependencies]
hopnet-common = { path = "../common" }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
clap = { version = "4.5.41", features = ["derive"] }
tracing-subscriber = "0.3.19"
rustix = { version = "1.0", features = ["process"] }

[dev-dependencies]
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros"] }
