[package]
name = "hopnet-storage"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://git.bentley.sh/HopNet/HopNet"
description = "HopNet distribution substrate: encrypted blob storage, Reed-Solomon fragments, deterministic placement (RFC-014)"

[dependencies]
hopnet-common = { path = "../common", features = ["database"] }

blake3 = "1.8.2"
chacha20poly1305 = { version = "0.10.1", features = ["stream"] }
x25519-dalek = { version = "2.0.1", features = ["serde", "static_secrets"] }
rand = "0.10"
serde = { version = "1.0.219", features = ["derive"] }
bincode = { version = "2.0.1", features = ["serde"] }
hex = "0.4.3"
tracing = "0.1"

# Engine feature (Stage E): the tokio distribution engine. Empty for now —
# pure modules (crypto, rs, fragstore, placement) never need a runtime.
[features]
engine = []
