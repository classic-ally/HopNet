[package]
name = "hopnet-storage"
version.workspace = true
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://git.bentley.sh/HopNet/HopNet"
description = "HopNet distribution substrate: encrypted blob storage, Reed-Solomon fragments, deterministic placement (RFC-014)"

[dependencies]
hopnet-common = { path = "../common", features = ["database"] }
# Comms vocabulary only (Rpc trait + PeerRef) - never the iroh transport.
hopnet-comms = { path = "../hopnet-comms" }

blake3 = "1.8.2"
chacha20poly1305 = { version = "0.10.1", features = ["stream"] }
x25519-dalek = { version = "2.0.1", features = ["serde", "static_secrets"] }
rand = "0.10"
serde = { version = "1.0.219", features = ["derive"] }
bincode = { version = "2.0.1", features = ["serde"] }
hex = "0.4.3"
rusqlite = { version = "0.38", features = ["bundled"] }
tracing = "0.1"

reed-solomon-simd = "3.0.1"

# Engine feature: async substrate surfaces (api::put, api::get, the
# distribution engine). Pure modules never need a runtime; the engine owns
# NO runtime of its own — hosts pass tokio Handles at spawn.
tokio = { version = "1", features = ["io-util", "rt", "sync", "time", "macros"], optional = true }
tokio-stream = { version = "0.1.17", optional = true }
async-stream = { version = "0.3.6", optional = true }
bytes = { version = "1.10.1", optional = true }

[features]
engine = ["dep:tokio", "dep:tokio-stream", "dep:async-stream", "dep:bytes"]

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread"] }
tokio-stream = "0.1.17"
tempfile = "3"
